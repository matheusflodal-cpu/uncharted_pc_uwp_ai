name: Xbox CPU diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['xbox/**']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ninja and archive decoder
        run: python -m pip install ninja==1.11.1.4 zstandard==0.23.0
      - name: Build UWP CPU and memory diagnostic
        shell: pwsh
        run: ./xbox/scripts/build.ps1
      - name: Test UWP memory backend on desktop Windows
        shell: pwsh
        timeout-minutes: 3
        run: |
          $directory=Join-Path $env:RUNNER_TEMP 'uncharted-memory-contract'
          New-Item -ItemType Directory -Force $directory | Out-Null
          & ./xbox/.local/build/uncharted_memory_contract.exe $directory 2>&1 | Tee-Object xbox/.local/memory-contract.log
          if($LASTEXITCODE) { throw "Memory contract failed: $LASTEXITCODE" }
      - name: Package diagnostic (no game files)
        shell: pwsh
        run: ./xbox/scripts/package.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Uncharted-UWP-CPU-diagnostic
          path: xbox/.local/packages/UnchartedUwpProbe-0.1.0.0.zip
          if-no-files-found: error
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Uncharted-UWP-build-evidence
          path: |
            xbox/.local/build/CMakeCache.txt
            xbox/.local/build/CMakeFiles/CMakeConfigureLog.yaml
            xbox/.local/memory-contract.log
          if-no-files-found: ignore
